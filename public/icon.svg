<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="meterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#1e293b" stroke-width="8" />

  <!-- Taxi Sign Roof element -->
  <path d="M196 110 L316 110 L336 146 L176 146 Z" fill="#f59e0b" rx="6" />
  <text x="256" y="136" fill="#0f172a" font-family="Arial, sans-serif" font-weight="900" font-size="22" text-anchor="middle" letter-spacing="2">TAXI</text>

  <!-- Cab outline silhouette -->
  <path d="M110 230 L160 160 L352 160 L402 230 L430 250 L430 330 L400 330 A 30 30 0 0 1 340 330 L172 330 A 30 30 0 0 1 112 330 L82 330 L82 250 Z" fill="url(#accentGrad)" opacity="0.9" />

  <!-- Wheels -->
  <circle cx="142" cy="330" r="26" fill="#020617" stroke="#64748b" stroke-width="8" />
  <circle cx="370" cy="330" r="26" fill="#020617" stroke="#64748b" stroke-width="8" />

  <!-- Digital Meter HUD display box -->
  <rect x="136" y="380" width="240" height="74" rx="20" fill="#090d16" stroke="url(#meterGrad)" stroke-width="4" />
  <circle cx="166" cy="417" r="6" fill="#10b981" />
  <text x="186" y="425" fill="#ffffff" font-family="monospace" font-weight="900" font-size="28" letter-spacing="1">SBS METER</text>
</svg>
