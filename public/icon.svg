<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Luxury Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Metallic Gold Gradient -->
    <linearGradient id="goldMetallic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="30%" stop-color="#eab308" />
      <stop offset="70%" stop-color="#ca8a04" />
      <stop offset="100%" stop-color="#854d0e" />
    </linearGradient>

    <!-- Crimson Red Accent Gradient -->
    <linearGradient id="redAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>

    <!-- Glowing Rim Light -->
    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eab308" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#ef4444" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.8" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.75" />
    </filter>
  </defs>

  <!-- Base App Icon Background Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGradient)" />
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="url(#borderGlow)" stroke-width="6" opacity="0.8" />

  <!-- Background Decorative Grid Lines -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="2" />
  <circle cx="256" cy="256" r="160" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="2" />

  <!-- Central Shield Badge Shield Outline -->
  <path d="M256 60 L390 110 C390 270 290 390 256 425 C222 390 122 270 122 110 Z" fill="#090d16" stroke="url(#goldMetallic)" stroke-width="10" filter="url(#dropShadow)" />
  <path d="M256 74 L376 120 C376 260 282 370 256 404 C230 370 136 260 136 120 Z" fill="#0f172a" stroke="url(#redAccent)" stroke-width="3" opacity="0.6" />

  <!-- Taxi Crown / Crest on Top of Shield -->
  <g transform="translate(0, -10)">
    <!-- Taxi Roof Light -->
    <rect x="206" y="105" width="100" height="28" rx="8" fill="url(#goldMetallic)" stroke="#1e293b" stroke-width="2" />
    <text x="256" y="125" fill="#020617" font-family="'Montserrat', 'Arial Black', sans-serif" font-weight="900" font-size="16" text-anchor="middle" letter-spacing="3">TAXI</text>
  </g>

  <!-- Big Bold Lettermark "SBS" -->
  <text x="256" y="270" fill="url(#goldMetallic)" font-family="'Montserrat', 'Arial Black', 'Impact', sans-serif" font-weight="900" font-size="110" text-anchor="middle" letter-spacing="4" filter="url(#dropShadow)">SBS</text>

  <!-- Crimson Banner Ribbon behind "TRAVELS" -->
  <rect x="146" y="295" width="220" height="38" rx="12" fill="url(#redAccent)" stroke="url(#goldMetallic)" stroke-width="2" />
  <text x="256" y="321" fill="#ffffff" font-family="'Montserrat', 'Arial Black', sans-serif" font-weight="900" font-size="20" text-anchor="middle" letter-spacing="6">TRAVELS</text>

  <!-- Bottom Quality Stars -->
  <g fill="url(#goldMetallic)" transform="translate(0, 365)">
    <polygon points="256,0 261,12 274,12 263,19 267,31 256,23 245,31 249,19 238,12 251,12" />
    <polygon points="220,5 224,15 235,15 226,21 229,31 220,24 211,31 214,21 205,15 216,15" opacity="0.8" />
    <polygon points="292,5 296,15 307,15 298,21 301,31 292,24 283,31 286,21 277,15 288,15" opacity="0.8" />
  </g>
</svg>
