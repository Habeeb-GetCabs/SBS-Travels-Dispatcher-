name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build SBS Travels Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Grant execute permission for gradlew
        run: |
          if [ -f "./android/gradlew" ]; then
            chmod +x ./android/gradlew
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Web App & Bundle Assets into Android
        run: |
          npm ci || npm install
          npm run build
          mkdir -p ./android/app/src/main/assets
          cp -r ./dist/* ./android/app/src/main/assets/
          rm -f ./android/app/src/main/assets/app-debug.apk

      - name: Build Android Debug APK
        working-directory: ./android
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Verify APK Exists
        run: |
          echo "Checking generated APK files..."
          ls -lh ./android/app/build/outputs/apk/debug/*.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbs-travels-debug-apk
          path: ./android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Publish Direct Downloadable APK to GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-debug
          name: "SBS Travels Driver App (Corrected Debug APK)"
          body: |
            ### SBS Travels Driver App - Corrected Debug APK
            - **Target Device:** Motorola Edge 50 Pro (Android 16 compatible)
            - **Fixes included:**
              - Clean monochrome vector icon `ic_notification` (prevents SystemUI freeze)
              - Service configured with `START_NOT_STICKY`
              - Safe null-intent check with immediate shutdown
              - WakeLock only active during trip meter run (removed from `onCreate`)
              - Runtime foreground service location permissions gate
            - **Direct Download:** Download `app-debug.apk` directly below (no zip extraction needed).
          draft: false
          prerelease: false
          files: ./android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
